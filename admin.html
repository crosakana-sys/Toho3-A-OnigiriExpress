<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>おにぎりEXPRESS 注文管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap">
<style>
:root{--bg:#F4ECDD;--card:#fff;--ink:#1A1A1A;--sub:#6b655b;--red:#C8102E;--line:#d9cfbb;--chip:#f1e6d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1d;--ink:#f1ece2;--sub:#a8a195;--red:#ff5a73;--line:#333;--chip:#2a2a2a}}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1d;--ink:#f1ece2;--sub:#a8a195;--red:#ff5a73;--line:#333;--chip:#2a2a2a}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.4rem;font-weight:900;margin:0 0 12px}
h2{font-size:1.15rem;font-weight:900;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.days{display:flex;gap:8px;margin-bottom:8px}
.days button{flex:1;padding:10px;border:2px solid var(--ink);border-radius:12px;background:transparent;font-weight:900}
.days button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.meta{color:var(--sub);font-size:.85rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:99px;padding:3px 12px;font-weight:900;font-size:.9rem}
.chip b{color:var(--red);margin-left:4px}
.ord{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ord.done{opacity:.45}
.ord .nm{font-weight:900}
.ord small{color:var(--sub)}
.ord .pk{grid-column:2;font-size:.88rem}
.ord input{width:22px;height:22px;accent-color:var(--red)}
.del{border:0;background:transparent;color:var(--sub);font-size:1.1rem;padding:4px 8px}
input[type=password]{width:100%;font:inherit;padding:10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.go{margin-top:8px;padding:10px 20px;border:0;border-radius:99px;background:var(--red);color:#fff;font-weight:900}
.empty{color:var(--sub);font-size:.9rem;margin:4px 0 0}
</style>
</head>
<body>
<main>
  <h1>🍙 おにぎりEXPRESS 注文管理</h1>
  <section class="card" id="login">
    <h2>パスワード</h2>
    <p class="meta">Code.gs に書いた KEY を入力してください。</p>
    <input type="password" id="pw" aria-label="パスワード" autocomplete="current-password">
    <button class="go" type="button" id="in">開く</button>
    <p class="meta" id="lm" role="alert"></p>
  </section>
  <div id="app" hidden>
    <div class="days" id="days">
      <button type="button" data-d="10/10" aria-pressed="true">10/10 DAY1 SATURDAY</button>
      <button type="button" data-d="10/11" aria-pressed="false">10/11 DAY2 SUNDAY</button>
    </div>
    <p class="meta" id="upd" role="status"></p>
    <div id="view"></div>
  </div>
</main>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbwtjE2G5wKYwi5phw6KQyFJNwzw50chEmNdY8ubqvWpHwnKwHja41rEE2WQFmDm3dMV9Q/exec";
const TIMES=["11:00","12:30","13:30","15:00"];
let key=sessionStorage.getItem("k")||"", dayF="10/10", orders=[], timer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb="cb"+Date.now()+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");
    const t=setTimeout(()=>{cleanup();reject(new Error("timeout"))},25000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error("load"))};
    s.src=ENDPOINT+"?"+new URLSearchParams({...params,callback:cb});
    document.head.appendChild(s);
  });
}
async function api(body){return body?jsonp({payload:JSON.stringify({...body,key})}):jsonp({key})}
function say(msg,bad){const u=$("upd");u.textContent=msg;u.style.color=bad?"var(--red)":"";u.style.fontWeight=bad?"900":""}
async function load(){
  if(!ENDPOINT.startsWith("http")){say("admin.html の https://script.google.com/macros/s/AKfycbwtjE2G5wKYwi5phw6KQyFJNwzw50chEmNdY8ubqvWpHwnKwHja41rEE2WQFmDm3dMV9Q/exec をURLに置き換えてください",true);return}
  try{
    const j=await api();
    if(!j.ok){if(j.error==="auth")logout("パスワードが違います");else say("読み込めませんでした("+j.error+")",true);return}
    orders=j.orders.filter(o=>o&&o.code);render();
    say("v3・注文"+orders.length+"件を読み込みました・最終更新 "+new Date().toLocaleTimeString("ja-JP")+"(20秒ごとに自動更新)");
  }catch(e){
    say("通信できません。通信状態とURL、デプロイの「アクセスできるユーザー」(全員)を確認してください。",true);
  }
}
function start(){$("login").hidden=true;$("app").hidden=false;clearInterval(timer);load();timer=setInterval(load,20000)}
function logout(msg){sessionStorage.removeItem("k");key="";clearInterval(timer);$("app").hidden=true;$("login").hidden=false;$("lm").textContent=msg||""}
function tally(list){
  const m=new Map();
  list.forEach(o=>o.picks.split("・").filter(Boolean).forEach(f=>m.set(f,(m.get(f)||0)+1)));
  return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"));
}
const chips=t=>t.length?`<div class="chips">${t.map(([f,n])=>`<span class="chip">${esc(f)}<b>${n}個</b></span>`).join("")}</div>`:"";
function setsText(p){const a=p.split("・").filter(Boolean),o=[];for(let i=0;i<a.length;i+=2)o.push(a.slice(i,i+2).join("+"));return o.join(" / ")}
function render(){
  const day=orders.filter(o=>o.day===dayF);
  const sum=l=>l.reduce((s,o)=>s+(o.qty||0),0);
  let html=`<section class="card"><div class="head"><h2>🍙 全日程の合計</h2><span class="meta">${orders.length}件・おにぎり${sum(orders)*2}個・${(sum(orders)*800).toLocaleString()}円</span></div>${orders.length?chips(tally(orders)):'<p class="empty">まだ注文がありません。</p>'}</section>`;
  html+=`<section class="card"><div class="head"><h2>${dayF} の合計</h2><span class="meta">${day.length}件・おにぎり${sum(day)*2}個・${(sum(day)*800).toLocaleString()}円</span></div>${day.length?chips(tally(day)):'<p class="empty">この日はまだ注文がありません。</p>'}</section>`;
  TIMES.forEach(t=>{
    const list=day.filter(o=>o.time===t).sort((a,b)=>new Date(a.at)-new Date(b.at));
    const sets=sum(list);
    html+=`<section class="card"><div class="head"><h2>🕒 ${t} 受け取り</h2><span class="meta">${list.length}件・${sets}セット・おにぎり${sets*2}個・${(sets*800).toLocaleString()}円</span></div>`;
    if(!list.length){html+='<p class="empty">注文なし</p></section>';return}
    html+=chips(tally(list));
    list.forEach(o=>{
      html+=`<div class="ord ${o.done?"done":""}"><input type="checkbox" data-c="${esc(o.code)}" ${o.done?"checked":""} aria-label="${esc(o.name)}さんを受け渡し済みにする"><span><span class="nm">${esc(o.name)}</span> <small>#${esc(o.code)}・${o.qty}セット</small></span><button class="del" type="button" data-x="${esc(o.code)}" aria-label="${esc(o.name)}さんの注文を削除">🗑</button><span class="pk">${esc(setsText(o.picks))}</span></div>`;
    });
    html+="</section>";
  });
  $("view").innerHTML=html;
}
$("in").onclick=()=>{key=$("pw").value;if(!key)return;sessionStorage.setItem("k",key);start()};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("in").click()};
$("days").onclick=e=>{const b=e.target.closest("button");if(!b)return;dayF=b.dataset.d;
  document.querySelectorAll("#days button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("view").onchange=async e=>{
  const c=e.target.closest("[data-c]");if(!c)return;
  const o=orders.find(x=>x.day===dayF&&x.code===c.dataset.c);if(!o)return;
  o.done=c.checked;render();
  try{await api({action:"done",day:o.day,code:o.code,value:o.done})}catch(err){}
  load();
};
$("view").onclick=async e=>{
  const d=e.target.closest("[data-x]");if(!d)return;
  const o=orders.find(x=>x.day===dayF&&x.code===d.dataset.x);
  if(!o||!confirm(o.name+"さんの注文を削除しますか?"))return;
  try{await api({action:"delete",day:o.day,code:o.code})}catch(err){}
  load();
};
if(key)start();
</script>
</body>
</html>
